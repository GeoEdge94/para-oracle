[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veralith-pipeline"
version = "0.1.0"
description = "Veralith — geospatial resolution pipeline. Ingest → Normalize → Resolve → Sign."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Veralith", email = "tech@veralith.io" }]
keywords = ["geospatial", "oracle", "prediction-market", "satellite", "polymarket"]

dependencies = [
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "shapely>=2.0",
  "geojson>=3.1",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
storage = ["aioredis>=2.0", "google-cloud-firestore>=2.16"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pytest-cov>=5.0", "ruff>=0.7", "mypy>=1.13"]

[project.scripts]
veralith = "veralith_pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/veralith_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
  "integration: end-to-end pipeline tests",
  "slow: tests that hit network (skip in CI default)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
