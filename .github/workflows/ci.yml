name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff mypy
      - run: ruff check backend/app || true   # warn-only for MVP
      - run: mypy backend/app --ignore-missing-imports || true

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: paraoracle_test
          POSTGRES_USER: paraoracle
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paraoracle"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get install -y gdal-bin libgdal-dev
      - run: pip install -r backend/requirements.txt pytest pytest-asyncio
      - run: cd backend && pytest -v || true  # no tests yet

  reproducibility:
    name: Pipeline reproducibility (3x same hashes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get install -y gdal-bin libgdal-dev
      - run: pip install -r backend/requirements.txt
      - name: Run mock pipeline 3 times and diff hashes
        run: |
          cd backend
          python -c "
          from app.services.ndvi_pipeline import NDVIPipeline, PipelineConfig
          from datetime import date
          cfg = PipelineConfig(
            bet_slug='para-deforestation-2025-s1',
            period_start=date(2025,1,1),
            period_end=date(2025,6,30),
            region_geom_wkt='MULTIPOLYGON(((-59 -9.5, -46 -9.5, -46 2.5, -59 2.5, -59 -9.5)))',
          )
          import os; os.environ['USE_MOCK_SENTINEL']='true'; os.environ['DATA_DIR']='/tmp/para-runs'
          runs = [NDVIPipeline(cfg).run() for _ in range(3)]
          hashes = [(r['script_hash'], r['ndvi_t0_hash'], r['ndvi_t1_hash'], r['delta_hash'], r['mask_hash']) for r in runs]
          assert hashes[0] == hashes[1] == hashes[2], f'Non-deterministic: {hashes}'
          print('OK: 3 runs = identical hashes')
          "

  frontend-lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm install
      - run: cd frontend && npx tsc --noEmit
      - run: cd frontend && npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-lint-typecheck, frontend-lint-build]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t para-backend ./backend
      - run: docker build -t para-frontend ./frontend
