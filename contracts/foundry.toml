[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "ipfs"
evm_version = "paris"
fs_permissions = [{ access = "read", path = "./"}]

[rpc_endpoints]
amoy = "${CHAIN_RPC_URL}"
localhost = "http://127.0.0.1:8545"

[etherscan]
amoy = { key = "${POLYGONSCAN_API_KEY}", url = "https://api-amoy.polygonscan.com/api" }
